# One pod job of the v2 CLS/STM runs (sky/v2_pod_job.sh). Launch with sky/v2_launch.sh, which passes JOB, ROUND,
# COMMIT, UNIT_TIMEOUT and the actions file (ACTIONS_B64), applies autostop separately (-i/--down are ignored with -d), and logs.
# Reap with sky/v2_reap.sh; status with sky/v2_status.sh.
name: v2-pod
resources:
  infra: runpod
  # Wide list: the cheap cards have thin capacity (running_experiments_kb.md section 10). Ordered roughly by price.
  accelerators: {RTXA4000: 1, RTXA5000: 1, L4: 1, A40: 1, RTX3090: 1, L40S: 1, RTX4090: 1}
  cpus: 4+
  memory: 16+
  disk_size: 60
workdir: ~/Dev/episodic_looking
file_mounts:
  # The repo lands at ~/sky_workdir, so ../ is ~ (do not symlink the repo: section 12).
  ~/cifar-100-python: ~/Dev/datasets/cifar-100-python
  ~/cifar_100_pretrain/cifar_100_subclasses_12_e13.pth: ~/Dev/cifar_100_pretrain/cifar_100_subclasses_12_e13.pth
  ~/cifar_100_pretrain/cifar_100_subclasses_12_e40.pth: ~/Dev/cifar_100_pretrain/cifar_100_subclasses_12_e40.pth
envs:
  JOB: ""
  ROUND: ""
  COMMIT: ""
  ACTIONS_B64: ""
  NPROC: "3"
  # Per-unit cap (timeout(1) syntax). Empty here on purpose: the pod job refuses to start without it, and the launcher
  # refuses to launch without it (suggested values: sky/v2_launch.sh header).
  UNIT_TIMEOUT: ""
setup: |
  set -e
  df -h /dev/shm | tail -1
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  cd ~/sky_workdir
  test -x .venv/bin/python || /usr/bin/python3.12 -m venv .venv
  .venv/bin/pip install --quiet --upgrade pip
  .venv/bin/pip install --quiet -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cu126
  .venv/bin/python -c "import torch; print('torch', torch.__version__, torch.cuda.get_device_name(0))"
run: |
  cd ~/sky_workdir
  export PY=.venv/bin/python
  bash sky/v2_pod_job.sh
